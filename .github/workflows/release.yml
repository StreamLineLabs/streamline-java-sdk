name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  # Tagged publication depends on live conformance against an explicit,
  # immutable image digest (.github/workflows/integration.yml). If
  # STREAMLINE_CONFORMANCE_IMAGE_DIGEST is unset, not digest-pinned, or the
  # image is unreachable/absent, this job hard-blocks and `publish` never
  # runs.
  conformance:
    name: Live conformance (immutable image digest)
    uses: ./.github/workflows/integration.yml
    with:
      image: ${{ vars.STREAMLINE_CONFORMANCE_IMAGE_DIGEST }}

  publish:
    name: Verify, attest, and gate Maven Central publication
    needs: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Validate release tag matches Maven version
        run: scripts/validate-release-tag.sh "$GITHUB_REF_NAME"

      - name: Check Central Portal and GPG secrets
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: scripts/release-preflight.sh

      - name: Configure Central Portal credentials and GPG key
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Build, test, sign, and generate the SBOM. This intentionally stops at
      # `verify`, not `deploy`: nothing is uploaded to Central Portal until
      # the artifacts below have been checked and attested.
      - name: Build, test, sign, and generate SBOM (no publish)
        run: mvn --batch-mode verify -P release
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Verify release artifacts and SBOM
        run: scripts/verify-release-artifacts.sh

      - name: Attest Maven artifact provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ github.workspace }}/pom.xml
            ${{ github.workspace }}/streamline-client/pom.xml
            ${{ github.workspace }}/streamline-client/target/streamline-client-*.jar
            ${{ github.workspace }}/streamline-spring-boot-starter/pom.xml
            ${{ github.workspace }}/streamline-spring-boot-starter/target/streamline-spring-boot-starter-*.jar

      - name: Attest Maven artifact SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ github.workspace }}/pom.xml
            ${{ github.workspace }}/streamline-client/pom.xml
            ${{ github.workspace }}/streamline-client/target/streamline-client-*.jar
            ${{ github.workspace }}/streamline-spring-boot-starter/pom.xml
            ${{ github.workspace }}/streamline-spring-boot-starter/target/streamline-spring-boot-starter-*.jar
          sbom-path: ${{ github.workspace }}/target/sbom.cdx.json

      - name: Preserve verified artifacts for maintainer inspection
        uses: actions/upload-artifact@v4
        with:
          name: verified-maven-release-artifacts
          path: |
            streamline-client/target/streamline-client-*.jar
            streamline-spring-boot-starter/target/streamline-spring-boot-starter-*.jar
            target/sbom.cdx.json
          if-no-files-found: error

      # Deliberately and unconditionally fails closed. There is no
      # environment-variable bypass and no `mvn deploy` step: re-enabling
      # publication requires a reviewed implementation that uploads/promotes
      # the exact already-attested bytes.
      - name: Block Maven Central and GitHub publication until byte-identical promotion exists
        run: scripts/central-publish-gate.sh
