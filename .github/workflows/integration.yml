name: Integration Tests

# Live conformance against a real Streamline server. The image under test is
# never allowed to be absent or a mutable tag: `resolve-image` hard-blocks
# (scripts/require-image-digest.sh) unless it resolves to an explicit,
# immutable `repository@sha256:<digest>` reference, and both test jobs guard
# against a false-green run in which every *IT test was silently skipped
# (scripts/verify-executed-tests.sh).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday 4am UTC
  workflow_dispatch:
    inputs:
      image:
        description: >-
          Immutable Streamline image to test against, pinned by digest, e.g.
          ghcr.io/streamlinelabs/streamline@sha256:<64 lowercase hex chars>.
          Falls back to the STREAMLINE_CONFORMANCE_IMAGE_DIGEST repository
          variable when omitted. Mutable tags such as ":latest" (and an
          absent image) are hard-blocked, never silently defaulted.
        required: false
  workflow_call:
    inputs:
      image:
        description: Same contract as the workflow_dispatch "image" input above.
        required: false
        type: string
    outputs:
      image:
        description: The validated, digest-pinned image that live conformance ran against.
        value: ${{ jobs.resolve-image.outputs.image }}

jobs:
  resolve-image:
    name: Resolve and hard-block on a non-digest-pinned image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and validate the conformance image digest
        id: resolve
        env:
          # No hardcoded fallback: an explicit input/variable is required, or
          # this step hard-blocks. Never defaults to ":latest" or any other
          # mutable/nonexistent image.
          IMAGE: ${{ inputs.image || vars.STREAMLINE_CONFORMANCE_IMAGE_DIGEST }}
        run: |
          scripts/require-image-digest.sh "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  integration:
    name: Integration tests (live server)
    needs: resolve-image
    runs-on: ubuntu-latest
    services:
      streamline:
        # GitHub does not expand `env` in service definitions, so the
        # already-validated digest is taken straight from the preceding job's
        # output.
        image: ${{ needs.resolve-image.outputs.image }}
        ports:
          - 9092:9092
          - 9094:9094
        options: >-
          --health-cmd "curl -f http://localhost:9094/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Wait for Streamline
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9094/health/live && exit 0
            echo "Waiting for Streamline... ($i/30)"
            sleep 2
          done
          echo "Streamline did not become healthy" >&2
          exit 1

      # STREAMLINE_INTEGRATION=1 is the explicit opt-in: the *IT suites fail fast
      # (instead of silently skipping) when the endpoints below are unreachable.
      - name: Run integration tests
        run: mvn --batch-mode verify -Pintegration
        env:
          STREAMLINE_INTEGRATION: '1'
          STREAMLINE_BOOTSTRAP_SERVERS: localhost:9092
          STREAMLINE_HTTP_URL: http://localhost:9094

      - name: Guard against zero executed or all-skipped conformance tests
        run: scripts/verify-executed-tests.sh streamline-client/target/failsafe-reports

  testcontainers:
    name: Testcontainers module
    needs: resolve-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run container integration tests
        run: mvn --batch-mode verify -Pintegration
        working-directory: testcontainers
        env:
          STREAMLINE_INTEGRATION: '1'
          STREAMLINE_IMAGE: ${{ needs.resolve-image.outputs.image }}

      - name: Guard against zero executed or all-skipped container tests
        run: scripts/verify-executed-tests.sh testcontainers/target/failsafe-reports
