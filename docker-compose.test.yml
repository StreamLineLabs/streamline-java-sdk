# Docker Compose for integration testing.
#
#   STREAMLINE_IMAGE=ghcr.io/streamlinelabs/streamline@sha256:<digest> \
#       docker compose -f docker-compose.test.yml up -d
#   STREAMLINE_INTEGRATION=1 mvn verify -Pintegration
#   docker compose -f docker-compose.test.yml down -v
#
# STREAMLINE_IMAGE is required and must be an explicit, immutable,
# digest-pinned reference (repository@sha256:<64 hex chars>); there is no
# default, and mutable tags such as ":latest" are not accepted by
# scripts/require-image-digest.sh (see Makefile's integration-test target and
# .github/workflows/integration.yml, which enforce this the same way).
services:
  streamline:
    image: ${STREAMLINE_IMAGE:?Set STREAMLINE_IMAGE to an explicit, digest-pinned Streamline image, e.g. ghcr.io/streamlinelabs/streamline@sha256:<64 hex chars>. Mutable tags such as :latest are not accepted.}
    ports:
      - "${STREAMLINE_KAFKA_PORT:-9092}:9092"
      - "${STREAMLINE_HTTP_PORT:-9094}:9094"
    environment:
      - STREAMLINE_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9094/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
