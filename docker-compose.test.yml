# Docker Compose for integration testing.
#
#   docker compose -f docker-compose.test.yml up -d
#   STREAMLINE_INTEGRATION=1 mvn verify -Pintegration
#   docker compose -f docker-compose.test.yml down -v
#
# STREAMLINE_IMAGE overrides the image, e.g. a locally built one:
#   STREAMLINE_IMAGE=ghcr.io/streamlinelabs/streamline:0.3.0 docker compose -f docker-compose.test.yml up -d
services:
  streamline:
    image: ${STREAMLINE_IMAGE:-ghcr.io/streamlinelabs/streamline:latest}
    ports:
      - "${STREAMLINE_KAFKA_PORT:-9092}:9092"
      - "${STREAMLINE_HTTP_PORT:-9094}:9094"
    environment:
      - STREAMLINE_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9094/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
